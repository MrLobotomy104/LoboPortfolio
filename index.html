<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:ital,wght@0,400;0,600;1,400&amp;family=Gloria+Hallelujah&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--inner:#2548D6;--frame:#6B55F2;--side:#2D57EE;--cw:min(78vw,580px);--ink:#fff;--mut:rgba(255,255,255,.72);--line:rgba(255,255,255,.28);--hd:"Anton","Impact",sans-serif;--bd:"Archivo",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font:17px/1.55 var(--bd);-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.page{position:relative;padding-top:16px}
.bgl{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--side);-webkit-mask-image:linear-gradient(#000 calc(100% - 80vh),rgba(0,0,0,.25) 100%);mask-image:linear-gradient(#000 calc(100% - 80vh),rgba(0,0,0,.25) 100%)}
.pat{position:absolute;left:-50%;top:-50%;width:200%;height:200%;transform:rotate(-15deg)}
.pbg{position:absolute;top:16px;bottom:0;left:50%;width:var(--cw);transform:translateX(-50%);background:var(--inner);border:8px solid var(--frame);border-bottom:0;border-radius:28px 28px 0 0}
.orn{position:absolute;top:0;left:0;width:100%;height:auto}
.foot{background:#000}
.foot img{display:block;margin:0 auto;width:min(150px,38vw);height:auto}
.foot{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}
.nada{margin:10px 0 0;text-align:center;font:400 1.2rem/1.3 "Gloria Hallelujah","Comic Sans MS",cursive;letter-spacing:.02em;color:#f1eeff;opacity:.92;transform:rotate(-2deg);filter:url(#chalk)}
#app{position:relative;width:var(--cw);margin:0 auto;padding:calc(var(--cw)*.27) 16px 170px;text-shadow:0 1px 3px rgba(0,10,50,.45)}
.fr,.lk,.btn,.chip{text-shadow:none}
h1,h2,h3{font:400 1em/1 var(--hd);margin:0;text-transform:uppercase;letter-spacing:.01em}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6px 24px}
.av{width:136px;height:136px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#000;display:grid;place-items:center;font:400 3rem var(--hd);flex:none}
h1{font-size:clamp(2.8rem,14vw,5.5rem);margin-top:0;text-wrap:balance;overflow-wrap:anywhere}
.bio{max-width:28em;margin:16px auto 0;font-size:1.1rem;white-space:pre-wrap}
.links{width:100%;margin-top:22px}
.lk{display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,420px);margin:0 auto 10px;padding:14px 18px;background:#fff;color:#000;border:2px solid #fff;font:600 1.05rem var(--bd);text-decoration:none;text-align:center;cursor:pointer}
.lk:hover{background:#000;color:#fff}
.lk.ig,.lk.ig:hover{background:linear-gradient(45deg,#FDC12F 0%,#F77737 18%,#D6249F 45%,#9B2FC0 72%,#4F5BD5 100%) border-box;border-color:transparent;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.lk.tw,.lk.tw:hover{background:#9146FF;border-color:#9146FF;color:#fff}
.lk.ig:hover,.lk.tw:hover{filter:brightness(1.12)}
.sec{padding:44px 6px 24px}
.hero .av{margin-bottom:14px}
.sec>h2{font-size:clamp(2.4rem,11vw,4.4rem);margin-bottom:24px}
.cols{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px}
.chip{flex:none;border:1px solid var(--line);background:none;color:#fff;padding:6px 14px;font:600 .95rem var(--bd);cursor:pointer}
.chip[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.grid{columns:2;column-gap:14px}
@media(min-width:760px){.grid{columns:3}}
.fr{break-inside:avoid;margin:0 0 14px;background:#f1f1f1;color:#111;padding:10px 10px 12px;cursor:zoom-in}
.fr img{display:block;width:100%;height:auto}
.fr figcaption{display:flex;justify-content:space-between;gap:8px;padding-top:9px;font-style:italic;font-size:.92rem;line-height:1.25}
.yr{color:#555;font-style:normal}
.mut{color:var(--mut)}
.pj{border-top:1px solid var(--line);padding:20px 0}
.pj h3{font-size:1.9rem;margin-bottom:8px}
.pj p{margin:0 0 8px;max-width:38em}
.pj a{color:#fff;font-weight:600}
.btn{display:inline-block;background:#fff;color:#000;border:2px solid #fff;padding:8px 14px;font:600 .95rem var(--bd);cursor:pointer}
.btn.ghost{background:none;color:#fff;border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.eb{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:3}
.le{display:flex;gap:10px;align-items:center;justify-content:space-between;width:min(100%,420px);margin:0 auto 10px;border:1px solid var(--line);background:rgba(0,0,0,.3);padding:8px 12px;font-weight:600;text-align:left}
.le .u{color:var(--mut);font-weight:400}
.x2{background:none;border:0;color:#fff;cursor:pointer;font-size:1.4rem;line-height:1}
.bgp{margin-top:22px;padding:12px;border:1px dashed var(--line);background:rgba(0,0,0,.3);font-size:.95rem;justify-content:center}
.bgp input[type=range]{width:120px}
.ed [contenteditable]{outline:1px dashed #fff;outline-offset:3px;min-width:2ch}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#000;border-top:1px solid var(--line);display:flex;justify-content:flex-end}

<script type="application/json" id="data">{"profile":{"name":"ETTORE RUSTICI","bio":"Ciao, Io sono Ettore in arte LOBO! Questo piccolo sito è un museo delle mie esperienze. Qua sotto puoi trovare tutti i link dei miei social, e le sezioni principali del sito, come Disegni, dove puoi esplorare tutti i miei capolavori e alcuni sketch di allenamento. Progetti dove pubblico delle cose interessanti che sto creando e infine Collezione dove ci sono delle valutazioni dei veri media che ho guardato e giocato, spero che ti piaccia! ","avatar":"02b3572bf661ec0b5e66abf4b555442a"},"bg":{"img":"","size":126,"inv":true},"links":[{"label":"Instagram","url":"instagram.com/ettore.rustici"},{"label":"Twitch","url":"twitch.tv/mrlobotomy104"}],"projects":[{"title":"QUESTO SITO!","desc":"Questo sito su cui stai navigando è un mio progetto, realizzato insieme a Claude, viene aggiornato molto spesso, puoi inviarmi un messaggio di report tramite i DM di instagram, sentiti libero di esplorarlo il più possibile!","url":"","blocks":[{"k":"t","txt":"Questo sito su cui stai navigando è un mio progetto, realizzato insieme a Claude, viene aggiornato molto spesso, puoi inviarmi un messaggio di report tramite i DM di instagram, sentiti libero di esplorarlo il più possibile!"}]},{"title":"OOLB BOT","desc":"Ho creato questo piccola intelligenza artificiale locale, ispirata ad uno dei miei personaggi, OOLB! Puoi consultare il personaggio tramite la categoria disegni, prova a capire qual'è dei tanti. L'AI è ancora in sviluppo, con Ollama per decidere il modello di AI e avviarlo tramite open-webUI sviluppato da OpenAI. Per ora si riduce ad un semplice chatbot, ma in futuro vorrei renderlo il mio piccolo assistente che mi aiuta con la gestione di un calendario con vari eventi e altri piccoli aiuti!","url":"","blocks":[{"k":"t","txt":"Ho creato questo piccola intelligenza artificiale locale, ispirata ad uno dei miei personaggi, OOLB! Puoi consultare il personaggio tramite la categoria disegni, prova a capire qual'è dei tanti. L'AI è ancora in sviluppo, con Ollama per decidere il modello di AI e avviarlo tramite open-webUI sviluppato da OpenAI. Per ora si riduce ad un semplice chatbot, ma in futuro vorrei renderlo il mio piccolo assistente che mi aiuta con la gestione di un calendario con vari eventi e altri piccoli aiuti!"},{"k":"i","id":"338a236dfc4385d67602c76f5cdfb3ad","w":20,"a":"c","cap":"La piccola icona di OOLB"}]}],"collections":[{"id":"c1","name":"Collezioni singole","desc":"Una raccolta di illustrazioni sparse. Goditi i quadri singolarmente"},{"id":"855p2ce","name":"Museo di un umano","desc":"Tutto quello che sono stato, sono e sarò."},{"id":"i0d6bpk","name":"Fan-Art","desc":"Piccoli disegni creati per celebrare i media che apprezzo."}],"works":[{"id":"vyblfbx","col":"c1","img":"bc1c608066f22774df9b88a1cfb1e582","title":"THE FOREST","year":"2026","tech":"Digitale","desc":"Questo quadro è inspirato alle title card del cartone animato \"Adventure Time\" firmato Cartoon Network, si può notare dai filtri applicati, come ad esempio la carta stopicciata o la famosa tecnica di colorazione dei fumetti tramite puntini. Il quadro rappresenta una foresta oscura dove sembra l'unica presenza di vita è il piccolo fiore giallo con la faccia da teschio, rappresentativo del mio personaggio. Ma il vero soggetto e la grande figura in disparte, inizialmente può sembrare intmidatoria, ma in verita è solo curiosa di cosa sia questo fiore unico.","feat":true},{"id":"xd6lleq","col":"c1","img":"99a4df41189c8f22fcc1ee97541d1e37","title":"Home","year":"2026","tech":"Digitale","desc":" A place that i can call home.\nIn verità in questo quadro non c'è nessuno sfondo che sembra una casa, anzi sembra tutto il contrario, i soggetti rappresentati sono rispettivamente Gesù Cristo e Dio. Possiamo capire che è Gesù dalla tunica che indossa ma soprattutto dalla sua aureola, che è appuntita come la sua famosa corona e rossa, come il sangue che ha versato. Invece Dio sembra un essere allungato dalle forme confuse, il suo corpo è fatto di galassie e al centro del suo cuore c'è la terra il nostro pianeta, la sua forma non è chiara da una parte rappresenta una figura femminile e dall'altra maschile. Un tributo al mio credo, quello che posso chiamare casa.","feat":true},{"id":"bu9pyo7","col":"c1","img":"b69438abae0979a272d4e48a9dcaf626","title":"Prey&Hunter","year":"2025","tech":"Digitale","desc":"Questo quadro è frutto di una sperimentazione della calligrafia con caratteri speciali, a sinistra abbiamo un cervo, simbolo di innocenza mentre a destra una volpe. Rispettivamnete la preda e il predatore, ma se notiamo bene le corna del cervo e i denti della volpe hanno delle particolari scritte. \"Hunter\" e \"Prey\", i ruoli sono invertiti mostrando che in realtà la loro forma è solo un'apparenza.\n\nConsulta atypography.com per maggiori informazioni sulla calligrafia."},{"id":"m5bc95h","col":"c1","img":"9519adf1ee6335f0c2bb92d2391a10a4","title":"Beach","year":"2026","tech":"Digitale","desc":"Questa è una sperimentazione del filtro fisheye. Illustrata una spiaggia al tramonto. Un vago ricordo in un mondo digitale di quello che è la terra in cui sono cresciuto, il mare."},{"id":"morx09l","col":"855p2ce","img":"6f41d2638bcec08017b4781a611666f3","title":"DUALITY","year":"2025","tech":"Digitale","desc":"Il quadro di apertura di questa galleria, rappresenta i soggetti principali di questa sezione, incastrati in questa forma circolare, rappresentando una sorta di ying e yang. Le 2 figure, anche se inizialmente solo una di queste, sono disegnate in modo frettoloso e impreciso simulando i disegni di un bambino."},{"id":"im3ccdt","col":"855p2ce","img":"974c479a54f46858d45c6dd5c8eee389","title":"CREAZIONE DI UN UMANO","year":"2026","tech":"Digitale","desc":"Questo sono io! Se sono distaccati hanno una loro forma, ma se vengono uniti possono creare qualcosa di ancora più bello. Un miscuglio tra i 2 soggetti, senza uno, non c'è l'altro. Questo è un umano in una rappresentazione semplice, niente va lasciato da parte.","feat":true},{"id":"66qnocu","col":"855p2ce","img":"fa325480598260a0415c28e27a2cc885","title":"METAMORPHOSIS","year":"2026","tech":"Digitale","desc":"Possiamo vedere rappresentato la bella parte di noi. Che si distacca dal suo guscio per risplendere, come intuisce il titolo sta avvenendo una metamorfosi, ma il colore rosso è sempre presente e alcuni pezzi sono ancora attaccati a noi, queste sono le cose che ci fanno crescere, in qualcosa di migliore."},{"id":"ayxeueb","col":"855p2ce","img":"6e5ffbd0c8e09ce11e4dd16966aba103","title":"PER TE...","year":"2025","tech":"Digitale","desc":"Questo quadro e il prossimo andranno in coppia!\nUna delle prime illustrazioni create per questa collezione. Quasi dall'aspetto horror possiamo vedere il soggetto in pena, confuso in mezzo all'oscurità con linne di movimento. Sembra mancargli qualcosa, dalla piccola scritta \"Fallo\" e il cervo in alto a sinistra possiamo dedurre che gli manca proprio il cuore."},{"id":"d10g8s8","col":"i0d6bpk","img":"30e917498d098be51db032a26bae1804","title":"HYLICS","year":"2026","tech":"Digitale - Pixel Art","desc":"Piccolo tributo alla saga videoludica di Hylics, possiamo vedere wayne e tutta la sua ciurma di strampalati amici!"},{"id":"6rtv285","col":"i0d6bpk","img":"3f20bf79e2e809d6ff0ed51faa2847c4","title":"GRACE","year":"2025","tech":"Digitale - Misto","desc":"Un vero miscuglio di tecniche in digitale, Illustrazione commemorativa per la dipartita del team di sviluppo di Grace, rappresenta (Quasi) tutti i personaggi e le modalità presenti nel gioco.","feat":true},{"id":"y8yyppg","col":"i0d6bpk","img":"8decd33e83f0dd2857ac6f865c4dab9e","title":"PROFONDO GIGANTESCO","year":"2025","tech":"Digitale - Pennello","desc":"Illustrazione creata con pennelli speciali per un gioco speciale, Outer Wilds!Rappresentato Profondo gigantesco e i resti del cannone orbitale."},{"id":"1zt87w8","col":"855p2ce","img":"e9b1188724a4a4ab97a729883df0dedf","title":"Fallo","year":"2025","tech":"Digitale","desc":"Questo quadro e il precedente andranno in coppia!\nIn corrispondenza questo è l'esatto opposto di questo quadro, il soggetto sembra contento e di certo il cuore  non gli manca, però sembra fermo rispetto all'altro e l'icona in alto a sinistra è diversa, sembrano 2 parti collegati dallo stesso cuore. I 2 quadri possono essere letti anche a parti inverse, dato che il titolo non cambia senso mettendo uno prima dell'altro e  saranno presenti entrambe le frasi grazie al titolo e alle piccole icone."},{"id":"xjs96g4","col":"855p2ce","img":"862197ef5c3ac1fc586ff4867bd0687a","title":"IL CAMPO","year":"2026","tech":"Digitale","desc":"possiamo vedere rappresentato i 2 soggetti uniti dentro ad una cupola di vetro. Isolati dal resto della natura piena, che al contrario, da loro e tutta secca. I fiori rappresentati sono dei tarassaci non ancora maturi, sembrano disegnati ancora una volta da un bambino, che vede per la prima volta un fiore e la natura che lo circonda, ma avendo paura di farsi male all'esterno. Il soggetto più grande sembra come in 3 dimensioni mentre l'altro ha una tecnica di pixel art. "}],"collezione":[{"id":"2gs7uaw","kind":"game","title":"STONEMACHIA","note":"","img":"498702550a9ca1ec0aaef8a3e5f00f49","rating":4},{"id":"uxldhg2","kind":"game","title":"HK: SILKSONG","note":"","img":"01188df5ff58ec30b977a1365c94b90e","rating":4,"plat":true},{"id":"qh81yln","kind":"game","title":"OUTER WILDS","note":"","img":"784c8f1aabda30d5ce7534813166c03c","plat":true,"rating":5},{"id":"wsv9cbm","kind":"anime","title":"GURREN LAGANN","note":"","img":"8532b815f46abe51737ae034e3827890","rating":5},{"id":"0z28gqq","kind":"anime","title":"CHAINSAW MAN","note":"","img":"b209beed9831f9bf5d9105350495bfbe","rating":4,"manga":true},{"id":"rna9zfs","kind":"anime","title":"FLCL (FOOLY COOLY)","note":"","img":"5a11792a38a307bd266c2b524ddfa97d","rating":4},{"id":"tua7493","kind":"game","title":"BALATRO","note":"","img":"362a5b812774c82fd3b5c24cd5bb531d","rati async function fit(f){

  const bmp=await createImageBitmap(f);

  for(let k=0;k<4;k++){
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    for(const [t,q] of [['image/png',undefined],['image/webp',.95]]){
      const b=await new Promise(r=>c.toBlob(r,t,q));
      if(b&&b.type===t&&b.size<=MAX)return new File([b],f.name.replace(/\.[^.]+$/,'')+(t==='image/png'?'.png':'.webp'),{type:t});
    }
    s*=.75;

      h('label',{},'Dimensione ',h('input',{type:'range',min:80,max:500,value:D.bg.size||220,oninput:e=>{D.bg.size=+e.target.value;touch();applyBg()}})),
      h('label',{},h('input',{type:'checkbox',checked:D.bg.inv,onchange:e=>{D.bg.inv=e.target.checked;touch();applyBg()}}),' Inverti'),
      D.bg.img&&B('Usa quello base',()=>{D.bg.img='';touch();render()})));
  const was=[...document.querySelectorAll('.sec.in')].map(s=>s.id);
  app.replaceChildren(...[can&&h('div',{class:'eb'},B(editor?'Esci dalla modifica':'Modifica',()=>{editor=!editor;render()})),
    hero,sec('disegni','Disegni',gallery()),sec('progetti','Progetti',projects()),sec('collezione','Collezione',collezione())].filter(Boolean));
  if(editor){
    sb=h('button',{class:'btn',type:'button',onclick:save,disabled:!dirty},'Salva e pubblica');
    document.body.append(h('div',{class:'bar'},B('Esporta per GitHub',exportSite),sb));
  }
  was.forEach(id=>{const e=document.getElementById(id);e&&e.classList.add('in')});
  watch();
}
async function exportSite(){
  let dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(!dl){say('Esportazione non disponibile in questa vista',6000);return}
  if(!window.JSZip){say('Libreria zip non caricata: ricarica la pagina e riprova',6000);return}
  const ids=[...new Set(JSON.stringify(D).match(/[0-9a-f]{32}/g)||[])],zip=new JSZip(),MAPX={};
  const EXT={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg','video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'};
  let n=0;
  for(const id of ids){
    try{say('Scarico i file… '+(++n)+'/'+ids.length,60000);const r=await fetch('/_blob/'+id);if(!r.ok)continue;const b=await r.blob();
      const ext=EXT[b.type.split(';')[0]]||'bin';MAPX[id]=ext;zip.file('images/'+id+'.'+ext,b)}catch(e){}
  }
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').replaceChildren();
  c.querySelectorAll('.pat,.orn path,.orn image').forEach(x=>x.removeAttribute('style'));
  c.querySelectorAll('.lb,.dt,.zm,.bar,.toast').forEach(x=>x.remove());
  c.querySelector('body').classList.remove('ed');
  c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  let html='<!DOCTYPE html>\n'+c.outerHTML;
  html=html.replace("const img=id=>'/_blob/'"+"+id;",()=>"const MAPX="+JSON.stringify(MAPX)+";const img=id=>'images/'+id+'.'+(MAPX[id]||'png');");
  html=html.replace(/<script src="[^"]*jszip[^"]*"><\/script>/,'');
  zip.file('index.html',html);
  say('Creo il file zip…',60000);
  try{
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
    await dl.save({filename:'portfolio-github.zip',data:blob});
    say('Zip pronto: scompattalo e carica index.html e la cartella images su GitHub',9000);
  }catch(e){say(e&&e.code==='declined'?'Salvataggio annullato':'Non sono riuscito a creare lo zip ('+((e&&(e.code||e.message))||'errore')+')',7000)}
}
async function save(){
  let A=null;try{A=await claude.use('artifact')}catch(e){}
  if(!A){say('Salvataggio non disponibile in questa vista');return}
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').replaceChildren();
  c.querySelectorAll('.pat,.orn path,.orn image').forEach(n=>n.removeAttribute('style'));
  c.querySelectorAll('.lb,.bar,.toast').forEach(n=>n.remove());
  c.querySelector('body').classList.remove('ed');
  c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  try{say('Pubblico…');await A.publish('<!DOCTYPE html>\n'+c.outerHTML)}
  catch(e){say(e&&e.code==='conflict'?'Aggiorno alla versione più recente…':'Non sono riuscito a salvare ('+((e&&e.code)||'errore')+')')}
}
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const o=document.querySelector('.orn');if(!o)return;
  const ps=[...o.querySelectorAll('path')],im=o.querySelector('image');
  ps.forEach(e=>{e.setAttribute('pathLength','1');e.style.strokeDasharray='1 1'});
  if(im){im.style.transformBox='fill-box';im.style.transformOrigin='center'}
  let intro=0,raf=0;
  const draw=q=>{
    ps.forEach((e,k)=>{const v=Math.min(1,Math.max(0,(q-(k%6)/9)/.45));e.style.strokeDashoffset=1-v;e.style.opacity=v>0?1:0});
    if(im){const a=Math.min(1,q*3);im.style.opacity=a;im.style.transform='scale('+(.6+.4*a)+')'}
  };
  const upd=()=>{raf=0;draw(Math.min(intro,Math.max(0,1-scrollY/110)))};
  addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(upd)},{passive:true});
  const t0=performance.now();
  const step=n=>{intro=Math.min(1,(n-t0)/1500);upd();if(intro<1)requestAnimationFrame(step)};
  draw(0);requestAnimationFrame(step);
})();
render();
(async()=>{try{const u=await window.claude.use('user');if(u&&await u.canEdit()){can=true;render()}}catch(e){}})();
</script>
